appId: com.netmerger.app
productName: NetMerger
copyright: Copyright © 2026 Nafis Sami
directories:
  output: dist
  buildResources: build

files:
  - out/**/*
  - node_modules/**/*
  - package.json

extraResources:
  - from: bin/yt-dlp.exe
    to: bin/yt-dlp.exe
  - from: node_modules/ffmpeg-static/ffmpeg.exe
    to: bin/ffmpeg.exe

win:
  signAndEditExecutable: false
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: NetMerger
